<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: dark;
      font-family: "Poppins", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #0f0f12 0%, #1a1a20 100%);
      color: #ffeef5;
      padding: 20px;
    }

    .card {
      background: #f8eaf1;
      color: #3c2230;
      padding: 24px 26px;
      border-radius: 18px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28);
      text-align: center;
      max-width: 320px;
      width: 100%;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.2rem;
    }

    p {
      margin: 0 0 8px;
      font-size: 0.95rem;
    }

    a {
      display: inline-block;
      margin-top: 10px;
      color: #c83f74;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Task Tracker</h1>
    <p>Redirecting to the app…</p>
    <a href="./task-tracker/">Open Task Tracker</a>
  </div>
  <script>
    setTimeout(() => {
      window.location.href = "./task-tracker/";
    }, 1200);
  </script>
</body>
</html>
