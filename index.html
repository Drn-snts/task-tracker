<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Tracker</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Poppins", "Segoe UI", sans-serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #0f0f12 0%, #1a1a20 100%);
      color: #ffeef5;
    }
    .card {
      background: #f8eaf1;
      color: #3c2230;
      padding: 20px 24px;
      border-radius: 18px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28);
      text-align: center;
      max-width: 320px;
    }
    a {
      display: inline-block;
      margin-top: 10px;
      color: #c83f74;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1 style="margin:0 0 8px; font-size: 1.2rem;">Task Tracker</h1>
    <p style="margin:0 0 8px;">Redirecting to the app…</p>
    <a href="./task-tracker/">Open Task Tracker</a>
  </div>
  <script>
    window.location.replace("./task-tracker/");
  </script>
</body>
</html>
