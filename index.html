<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: dark;
      --pink-900: #4e1630;
      --accent: #d4477b;
      --accent-strong: #c83f74;
      --ink: #3c2230;
      font-family: "Nunito", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at top, #24101d 0%, #0f0f12 55%, #09090b 100%);
      color: #ffeef5;
    }

    .card {
      width: min(92vw, 360px);
      background: linear-gradient(135deg, #fff3f8 0%, #f7dce8 100%);
      color: var(--ink);
      padding: 28px 24px;
      border-radius: 24px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.3);
      text-align: center;
      border: 1px solid rgba(212, 71, 123, 0.18);
    }

    .eyebrow {
      margin: 0 0 8px;
      font-family: "Poppins", sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent-strong);
    }

    h1 {
      margin: 0 0 10px;
      font-family: "Poppins", sans-serif;
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--pink-900);
    }

    p {
      margin: 0 0 16px;
      font-size: 0.95rem;
      color: #6f4b5a;
    }

    a {
      display: inline-block;
      padding: 10px 16px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      box-shadow: 0 8px 18px rgba(200, 63, 116, 0.24);
    }
  </style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">˖°⋆✧ pink task tracker ✧⋆°˖</p>
    <h1>Open your tracker</h1>
    <p>Loading the full task dashboard…</p>
    <a href="./task-tracker/">Open Task Tracker</a>
  </div>
  <script>
    setTimeout(() => {
      window.location.href = "./task-tracker/";
    }, 1200);
  </script>
</body>
</html>
